spring.application.name=notesbackend

# Explicitly declare the main application class to avoid ambiguity during devtools restart scans
spring.main.main-class=com.example.notesbackend.NotesBackendApplication

# Bind to 0.0.0.0:3001 for containerized environments and ensure readiness checks hit the same port
server.address=0.0.0.0
server.port=3001

# Spring DevTools settings to avoid noisy or repeated restarts and livereload chatter
spring.devtools.livereload.enabled=false
# Avoid adding extra devtools properties that might interfere in CI
spring.devtools.add-properties=false

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:notesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=PUBLIC

# Actuator Configuration
# Expose health and readiness endpoints on the same server port (no separate management port)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
# Optional: show details when requested
management.endpoint.health.show-details=when_authorized

# Swagger/OpenAPI Configuration
# springdoc 2.x serves the UI at /swagger-ui/index.html. We avoid mapping /swagger-ui.html to prevent conflicts.
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework
